<meta charset="UTF-8">
<title>Financial Clarity Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial, sans-serif;
background:#f5f7fa;
padding:40px;
text-align:center;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

input{
padding:12px;
width:60%;
font-size:16px;
margin-top:10px;
}

button{
padding:12px 20px;
font-size:16px;
margin-left:10px;
cursor:pointer;
background:#2c7be5;
color:white;
border:none;
border-radius:5px;
}

button:hover{
background:#1a68d1;
}

.results{
margin-top:25px;
text-align:left;
}

.result-item{
padding:6px 0;
}

canvas{
margin-top:30px;
}

</style>

</head>

<body>

<div class="container">

<h2>Financial Clarity Calculator</h2>

<p>Enter your monthly take-home pay to see a healthy financial breakdown.</p>

<input id="income" type="number" placeholder="Monthly take-home pay (£)">
<button onclick="calculateBudget()">Calculate</button>

<div id="results" class="results"></div>

<canvas id="chart"></canvas>

</div>

<script>

const breakdown = {

"Housing":0.35,
"Bills & Utilities":0.17,
"Food & Groceries":0.10,
"Transport":0.04,
"Savings & Investing":0.20,
"Lifestyle":0.09,
"Buffer":0.05

};

let chart;

function calculateBudget(){

const income = parseFloat(document.getElementById("income").value);

if(!income){return;}

const labels = [];
const data = [];

let html="<h3>Your Monthly Breakdown</h3>";

for(const category in breakdown){

const amount = income * breakdown[category];

labels.push(category);
data.push(amount);

html += `<div class="result-item"><strong>${category}</strong>: £${amount.toFixed(2)}</div>`;

}

// ✅ CTA SECTION WITH UPDATED LINK
html += `
<br><br>
<div style="margin-top:20px;padding:15px;background:#f0f4f8;border-radius:8px;">
  <strong>What this means for you:</strong><br>
  This breakdown shows how your money could be structured for better financial stability and long-term growth.
  <br><br>
  <strong>Next step:</strong><br>
  Want to understand how to improve your situation and take control of your finances?
  <br><br>
  <a href="https://matthow70.wixsite.com/reset-your-finances" target="_blank" 
     style="color:#2c7be5;font-weight:bold;text-decoration:none;">
     Visit the full guide →
  </a>
</div>
`;

document.getElementById("results").innerHTML = html;

const ctx = document.getElementById("chart").getContext("2d");

if(chart){chart.destroy();}

chart = new Chart(ctx,{

type:"pie",

data:{
labels:labels,
datasets:[{
data:data
}]
},

options:{
plugins:{
legend:{
position:"bottom"
}
}
}

});

}

</script>

</body>

</html>
